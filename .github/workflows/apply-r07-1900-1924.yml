name: apply-authenticated-r07-1900-1924

on:
  push:
    branches: [main]
    paths:
      - 'tools/forensics/r07_1900_1924_fragment.per'
      - '.github/workflows/apply-r07-1900-1924.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append authenticated slice and self-clean
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/forensics/r07_1900_1924_fragment.per
          test -f ShadowByzantine/04_construction.per

          if grep -q '^; R07 RULE 1900$' ShadowByzantine/04_construction.per; then
            echo 'R07 1900-1924 already present; nothing to append.'
            exit 0
          fi

          tail -n 1 ShadowByzantine/04_construction.per | grep -q '^)$'
          cat tools/forensics/r07_1900_1924_fragment.per >> ShadowByzantine/04_construction.per

          python3 - <<'PY'
          from pathlib import Path
          p = Path('ShadowByzantine/04_construction.per')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '; Implemented donor interval: 1794-1849',
              '; Implemented authenticated slices: 1794-1805, 1815-1924\n; Gap intentionally preserved: 1806-1814 remain unimplemented.'
          )
          p.write_text(s, encoding='utf-8')
          PY

          rm tools/forensics/r07_1900_1924_fragment.per
          rm .github/workflows/apply-r07-1900-1924.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ShadowByzantine/04_construction.per
          git add -u -- .github/workflows/apply-r07-1900-1924.yml tools/forensics/r07_1900_1924_fragment.per
          git commit -m 'construction: implement authenticated R07 1900-1924'
          git push origin HEAD:main
