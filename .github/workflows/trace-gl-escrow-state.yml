name: Trace gl-escrow-state
on:
  push:
    branches: [main]
    paths:
      - SourceShaRef
      - docs/SHARED_STATE_WRITER_READER_AUTHORITY_REGISTRY_v0.2.md
      - .github/workflows/trace-gl-escrow-state.yml
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace symbol
        shell: python
        run: |
          from pathlib import Path
          import re
          src=Path('SourceShaRef').read_text(encoding='utf-8').splitlines()
          sym='gl-escrow-state'
          rows=[]
          for i,line in enumerate(src,1):
              if sym not in line: continue
              access=[]
              if re.search(r'\b(set-goal|up-modify-goal)\s+'+re.escape(sym)+r'\b',line): access.append('DIRECT_WRITE')
              if re.search(r'\b(set-goal|up-modify-goal)\b',line) and sym in line: access.append('GOAL_MUTATION_CANDIDATE')
              if re.search(r'\b(goal|up-compare-goal)\s+'+re.escape(sym)+r'\b',line): access.append('READ')
              if re.search(r'\b(up-can-(?:build|train|research)|up-(?:build|train|research))\s+'+re.escape(sym)+r'\b',line): access.append('EXECUTOR_PARAMETER')
              if not access: access=['SYMBOL_REFERENCE']
              rows.append((i,';'.join(access),line.strip()))
          out=[]
          out += ['# gl-escrow-state Static Forensic Trace v0.1','', '**Source:** `SourceShaRef` on `main`', f'**Source line count:** {len(src)}', '', '## Verdict', '']
          writes=[r for r in rows if 'DIRECT_WRITE' in r[1]]
          if writes:
              out.append('Direct goal writes were recovered:')
              for n,a,l in writes: out.append(f'- line {n}: `{l}`')
          else:
              out.append('**No direct `set-goal gl-escrow-state` or `up-modify-goal gl-escrow-state` occurrence exists in the scanned donor source.**')
          out += ['', 'This is distinct from the escrow resource mutations performed by `set-escrow-percentage`, `up-modify-escrow`, and `release-escrow`: those mutate escrow accounting, not the `gl-escrow-state` goal itself.', '', '## All literal occurrences']
          out.append('| line | classification | source |')
          out.append('|---:|---|---|')
          for n,a,l in rows: out.append(f'| {n} | {a} | `{l.replace("|", "\\|")}` |')
          out += ['', '## Indirect-mutation audit', '', '- `gl-escrow-state` is passed as the `EscrowState` goal parameter to escrow-aware feasibility/execution commands.', '- Those commands **read** the goal value to select escrow-included versus escrow-deducted behavior; they do not write the goal.', '- `set-escrow-percentage`, `release-escrow`, and `up-modify-escrow` mutate the engine escrow amounts/policy, not `gl-escrow-state`.', '- Therefore the donor source establishes `gl-escrow-state` as a stable mode carrier whose value is supplied by goal state, while the resource escrow subsystem is mutated separately.', '', '## Evidence rule', '', 'Absence of a direct write is a static-source finding, not proof that the engine can never mutate the goal. Engine initialization/default semantics remain runtime/ABI evidence territory.']
          Path('docs/GL_ESCROW_STATE_FORENSIC_TRACE_v0.1.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          p=Path('docs/SHARED_STATE_WRITER_READER_AUTHORITY_REGISTRY_v0.2.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('| SSAR-S02-010 | S02 | MODE | gl-escrow-state | goal/SN; donor carrier | Shadow transaction layer | UNRECOVERED |', '| SSAR-S02-010 | S02 | MODE | gl-escrow-state | goal 205; donor carrier | Shadow transaction layer | **NO DIRECT WRITER RECOVERED** (static scan) |')
          s=s.replace('**NO DIRECT WRITER RECOVERED** (static scan) | S07,S08,production transaction paths |', '**NO DIRECT WRITER RECOVERED** (static scan) | S07,S08,production transaction paths |')
          p.write_text(s,encoding='utf-8')
      - name: Commit trace
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/GL_ESCROW_STATE_FORENSIC_TRACE_v0.1.md docs/SHARED_STATE_WRITER_READER_AUTHORITY_REGISTRY_v0.2.md
          git diff --cached --quiet || git commit -m 'forensics: trace gl-escrow-state writes and indirect mutations'
          git push
