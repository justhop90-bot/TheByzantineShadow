name: Shadow forensic source matrix

on:
  push:
    paths:
      - 'tools/forensics_shadow_source_matrix.py'
      - '.github/workflows/shadow-forensic-matrix.yml'
      - 'Shadow DC7.per'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate matrix from historical Git object
        run: python3 tools/forensics_shadow_source_matrix.py

      - name: Commit generated forensic artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/forensics/SHADOW_SOURCE_ORDER_MATRIX_v0.3.md
          if git diff --cached --quiet; then
            echo 'Matrix unchanged.'
            exit 0
          fi
          git commit -m 'forensics: generate full Shadow source-order matrix'
          git push
