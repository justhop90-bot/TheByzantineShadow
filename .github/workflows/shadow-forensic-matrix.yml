name: Shadow forensic source matrix

on:
  push:
    paths:
      - 'tools/forensics_shadow_source_matrix.py'
      - 'tools/forensics_shadow_cfg_escrow.py'
      - 'tools/forensics_shadow_cfg_escrow_v02.py'
      - 'tools/forensics_shadow_transplantation_atlas.py'
      - '.github/workflows/shadow-forensic-matrix.yml'
      - 'Shadow DC7.per'
      - 'ShadowSource.per'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate source-order matrix
        run: python3 tools/forensics_shadow_source_matrix.py

      - name: Generate live CFG and escrow path trace v0.1
        run: python3 tools/forensics_shadow_cfg_escrow.py

      - name: Generate corrected live CFG and escrow path trace v0.2
        run: python3 tools/forensics_shadow_cfg_escrow_v02.py

      - name: Generate rule-level transplantation atlas
        run: |
          sed -i 's/strip_comments/strip_comment/g' tools/forensics_shadow_transplantation_atlas.py
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import re

          p = pathlib.Path('tools/forensics_shadow_transplantation_atlas.py')
          spec = importlib.util.spec_from_file_location('atlas', p)
          atlas = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(atlas)

          original_extract = atlas.extract_rules

          def lossless_extract(text):
              rules, headings = original_extract(text)
              if not rules:
                  return rules, headings
              first_rule = rules[0]['start']
              valid = [(line, name) for line, name in headings if line >= first_rule]
              for r in rules:
                  prior = [h for h in valid if h[0] <= r['start']]
                  if prior:
                      line, name = prior[-1]
                      r['region'] = f'{name} @ L{line}'
                  else:
                      r['region'] = f'UNHEADED @ L{r["start"]}'
              return rules, headings

          atlas.extract_rules = lossless_extract

          def conservative_classify(donor, candidates):
              exact = [c for c in candidates if c['normalized'] == donor['normalized']]
              if exact:
                  return ('MOVED' if any(c['file'] != 'ShadowByzantine/ShadowByzantine.per' for c in exact) else 'PRESERVED'), exact[:3]
              ranked = sorted(((atlas.score(donor, c), c) for c in candidates), reverse=True, key=lambda x: x[0])
              strong = [c for s, c in ranked[:3] if s >= 8]
              return ('UNKNOWN', strong) if strong else ('LOST', [])

          atlas.classify = conservative_classify
          atlas.main()

          donor = pathlib.Path('ShadowSource.per').read_text(encoding='utf-8').splitlines()
          target_names = {"QID'S", 'QGENERAL', 'QPOSITION', 'QECONOMY'}
          all_headings = []
          for i, line in enumerate(donor, 1):
              m = re.match(r'^\s*;[^\n]*?\b(Q[A-Z0-9][A-Z0-9_ \'()/-]*)\b', line)
              if m and i >= 1300:
                  all_headings.append((i, m.group(1).strip()))
          targets = [(i, n) for i, n in all_headings if n in target_names]
          rows = []
          for line, name in targets:
              nxt = next((hline for hline, _ in all_headings if hline > line), None)
              end = (nxt - 1) if nxt is not None else len(donor)
              rows.append(f'| {name} | — (declaration) | L{line}–L{end} | no `defrule` ordinal; declaration/state-carrier namespace |')
          mp = pathlib.Path('docs/forensics/SHADOW_RULE_TRANSPLANTATION_MAP_v0.1.md')
          text = mp.read_text(encoding='utf-8')
          marker = '### A.0. Donor declaration regions (non-rule state namespace)'
          if marker in text:
              pre = text.split(marker, 1)[0].rstrip()
              post = text.split(marker, 1)[1]
              gen = post.split('<!-- BEGIN GENERATED RULE-LEVEL ATLAS -->', 1)
              post = ('<!-- BEGIN GENERATED RULE-LEVEL ATLAS -->' + gen[1]) if len(gen) == 2 else post
              text = pre + '\n\n' + post.lstrip()
          insertion = '\n'.join([
              marker, '',
              '| Declaration region | Ordinal | Source offsets | Evidence role |',
              '|---|---:|---|---|',
              *rows, ''
          ])
          text = text.replace('<!-- BEGIN GENERATED RULE-LEVEL ATLAS -->', insertion + '\n<!-- BEGIN GENERATED RULE-LEVEL ATLAS -->', 1)
          mp.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild ShadowByzantine runtime from authenticated donor
        run: |
          git show 1d9f45b3b9ac03adc24103df2b21c84b92a45fb6:'Shadow DC7.per' > /tmp/ShadowCanonical.per
          python3 - <<'PY'
          import hashlib
          import pathlib
          import re
          import subprocess

          donor_path = pathlib.Path('/tmp/ShadowCanonical.per')
          runtime_path = pathlib.Path('ShadowByzantine/ShadowByzantine.per')
          donor = donor_path.read_text(encoding='utf-8')

          expected_blob_sha1 = '70a18a3b69e8ea46bd5132673fe9fcf8a36595ee'
          blob_sha1 = subprocess.check_output(['git', 'hash-object', str(donor_path)], text=True).strip()
          print(f'authenticated historical donor Git blob SHA-1: {blob_sha1}')
          if blob_sha1 != expected_blob_sha1:
              raise SystemExit(f'authenticated historical donor blob mismatch: {blob_sha1}')

          donor_rules = len(re.findall(r'(?m)^\s*\(defrule\b', donor))
          if donor_rules != 1956:
              raise SystemExit(f'authenticated historical donor rule-count mismatch: {donor_rules}')

          adapted = donor.replace('(not(civ-selected viking))', '(not(civ-selected byzantines))')
          if donor.count('(not(civ-selected viking))') != 1:
              raise SystemExit('expected exactly one Viking civilization gate in authenticated donor')
          if adapted.count('(not(civ-selected byzantines))') != 1:
              raise SystemExit('Byzantine civilization gate replacement failed')

          runtime_path.write_text(adapted, encoding='utf-8')
          pathlib.Path('ShadowByzantine.per').write_text('(load "ShadowByzantine/ShadowByzantine")\n', encoding='utf-8')
          print(f'rebuilt {runtime_path}: {donor_rules} rules')
          print('adaptation: exactly one civ-selected viking -> civ-selected byzantines predicate')
          PY

      - name: Static transplant integrity check
        run: |
          git show 1d9f45b3b9ac03adc24103df2b21c84b92a45fb6:'Shadow DC7.per' > /tmp/ShadowCanonical.per
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess

          donor_path = pathlib.Path('/tmp/ShadowCanonical.per')
          donor = donor_path.read_text(encoding='utf-8')
          runtime = pathlib.Path('ShadowByzantine/ShadowByzantine.per').read_text(encoding='utf-8')
          if subprocess.check_output(['git', 'hash-object', str(donor_path)], text=True).strip() != '70a18a3b69e8ea46bd5132673fe9fcf8a36595ee':
              raise SystemExit('historical donor Git blob identity changed')
          normalized_donor = donor.replace('\r\n', '\n').replace('\r', '\n')
          normalized_runtime = runtime.replace('\r\n', '\n').replace('\r', '\n')
          expected = normalized_donor.replace('(not(civ-selected viking))', '(not(civ-selected byzantines))')
          if normalized_runtime != expected:
              raise SystemExit('runtime is not an exact authenticated historical donor transplant plus the authorized Byzantine civilization-gate substitution')
          if len(re.findall(r'(?m)^\s*\(defrule\b', runtime)) != 1956:
              raise SystemExit('runtime rule count is not 1956')
          if '(load ' in runtime:
              raise SystemExit('runtime contains nested load')
          print('PASS: 1956 rules; exact authenticated historical donor identity except authorized civ gate; no nested load')
          PY

      - name: Commit generated forensic artifacts and rebuilt runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ShadowByzantine.per ShadowByzantine/ShadowByzantine.per \
                  docs/forensics/SHADOW_SOURCE_ORDER_MATRIX_v0.3.md \
                  docs/forensics/SHADOW_LIVE_CONTROL_FLOW_AND_ESCROW_v0.1.md \
                  docs/forensics/SHADOW_LIVE_CONTROL_FLOW_v0.1.svg \
                  docs/forensics/SHADOW_LIVE_CONTROL_FLOW_AND_ESCROW_v0.2.md \
                  docs/forensics/SHADOW_LIVE_CONTROL_FLOW_v0.2.svg \
                  docs/forensics/SHADOW_RULE_TRANSPLANTATION_MAP_v0.1.md
          if git diff --cached --quiet; then
            echo 'Runtime and forensic artifacts unchanged.'
            exit 0
          fi
          git commit -m 'transplant: rebuild ShadowByzantine from authenticated historical donor'
          git push
