name: TEMP Shadow Replay Telemetry

on:
workflow_dispatch:

permissions:
contents: read

jobs:
parse-shadow-replay:
runs-on: ubuntu-latest

```
env:
  REPLAY_COMMIT: b313c0363753d3b73745a067c6f84d6bb23f52ed
  REPLAY_FILE: "SP Replay v101.103.48987.0 @2026.09.16 202614.aoe2record"
  EXPECTED_REPLAY_BLOB: 8322b48e9a5d2c9bd0d8c563bd9e246de8d9a498
  EXPECTED_REPLAY_BYTES: "5254614"

steps:
  - name: Checkout exact forensic commit
    uses: actions/checkout@v4
    with:
      ref: ${{ env.REPLAY_COMMIT }}
      fetch-depth: 0

  - name: Verify repository commit
    shell: bash
    run: |
      set -euo pipefail
      actual="$(git rev-parse HEAD)"
      test "$actual" = "$REPLAY_COMMIT"
      echo "Verified commit: $actual"

  - name: Verify replay
    shell: bash
    run: |
      set -euo pipefail

      test -f "$REPLAY_FILE"

      blob="$(git hash-object "$REPLAY_FILE")"
      bytes="$(stat -c '%s' "$REPLAY_FILE")"

      echo "Replay blob: $blob"
      echo "Replay bytes: $bytes"

      test "$blob" = "$EXPECTED_REPLAY_BLOB"
      test "$bytes" = "$EXPECTED_REPLAY_BYTES"

  - name: Verify .per integrity
    shell: bash
    run: |
      set -euo pipefail

      git ls-files -z -- '*.per' |
        xargs -0 sha256sum > "$RUNNER_TEMP/per-before.sha256"

      echo ".per baseline recorded."

  - name: Test Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 24

  - name: Test recording toolchain
    working-directory: tools/recording-tools
    shell: bash
    run: |
      set -euo pipefail

      npm install --ignore-scripts

      node -e '
        const p = require("agelens/package.json");
        console.log("agelens version:", p.version);
      '

  - name: Verify .per files unchanged
    shell: bash
    run: |
      set -euo pipefail

      git ls-files -z -- '*.per' |
        xargs -0 sha256sum > "$RUNNER_TEMP/per-after.sha256"

      diff -u \
        "$RUNNER_TEMP/per-before.sha256" \
        "$RUNNER_TEMP/per-after.sha256"

      echo ".per integrity check: PASS"

  - name: Publish verification artifact
    uses: actions/upload-artifact@v4
    with:
      name: shadow-replay-verification
      retention-days: 14
      path: |
        ${{ runner.temp }}/per-before.sha256
        ${{ runner.temp }}/per-after.sha256
```
