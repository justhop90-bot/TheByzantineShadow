name: TEMP Shadow Replay Telemetry

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/temp-shadow-replay-telemetry.yml

permissions:
  contents: read

jobs:
  verify-replay:
    runs-on: ubuntu-latest
    env:
      REPLAY_COMMIT: b313c0363753d3b73745a067c6f84d6bb23f52ed
      REPLAY_UPLOAD_COMMIT: 4f4650e566a88a9d29a9578ee45962203a9f074a
      REPLAY_FILE: "SP Replay v101.103.48987.0 @2026.09.16 202614.aoe2record"
      EXPECTED_REPLAY_BLOB: 8322b48e9a5d2c9bd0d8c563bd9e246de8d9a498
      EXPECTED_REPLAY_BYTES: "5254614"

    steps:
      - name: Checkout exact forensic commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPLAY_COMMIT }}
          fetch-depth: 0

      - name: Verify exact forensic commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$REPLAY_COMMIT"
          echo "Forensic commit verified: $actual"

      - name: Materialize exact replay from authenticated upload commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$REPLAY_UPLOAD_COMMIT"
          git show "$REPLAY_UPLOAD_COMMIT:$REPLAY_FILE" > "$RUNNER_TEMP/replay.aoe2record"
          test -s "$RUNNER_TEMP/replay.aoe2record"

      - name: Verify exact replay identity
        shell: bash
        run: |
          set -euo pipefail
          blob="$(git hash-object "$RUNNER_TEMP/replay.aoe2record")"
          bytes="$(stat -c '%s' "$RUNNER_TEMP/replay.aoe2record")"
          echo "Replay blob:  $blob"
          echo "Replay bytes: $bytes"
          test "$blob" = "$EXPECTED_REPLAY_BLOB"
          test "$bytes" = "$EXPECTED_REPLAY_BYTES"
          echo "Replay identity verified."

      - name: Record and verify tracked .per integrity
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.per' | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/per.sha256"
          if git status --porcelain -- '*.per' | grep -q .; then
            echo "::error::.per files are modified"
            exit 1
          fi
          echo ".per integrity verified."

      - name: Write UTF-8 verification record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/replay
          printf '%s\n' '{"kind":"repository","commit":"'"$REPLAY_COMMIT"'"}' > artifacts/replay/verification.jsonl
          printf '%s\n' '{"kind":"replay","source_commit":"'"$REPLAY_UPLOAD_COMMIT"'","file":"'"$REPLAY_FILE"'","blob":"'"$EXPECTED_REPLAY_BLOB"'","bytes":'"$EXPECTED_REPLAY_BYTES"'}' >> artifacts/replay/verification.jsonl
          printf '%s\n' '{"kind":"runtime","per_integrity":"PASS"}' >> artifacts/replay/verification.jsonl
          python3 - <<'PY'
          from pathlib import Path
          Path("artifacts/replay/verification.jsonl").read_text(encoding="utf-8")
          print("UTF-8 verification record: PASS")
          PY

      - name: Publish verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-replay-verification
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/replay/verification.jsonl
            ${{ runner.temp }}/per.sha256
