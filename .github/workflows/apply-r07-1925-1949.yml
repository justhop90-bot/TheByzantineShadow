name: apply-authenticated-r07-1925-1949

on:
  push:
    branches: [main]
    paths:
      - 'tools/forensics/r07_1925_1949_fragment.per'
      - '.github/workflows/apply-r07-1925-1949.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append authenticated interval and self-clean
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/forensics/r07_1925_1949_fragment.per
          test -f ShadowByzantine/04_construction.per
          if grep -q '^; 1925 -- QEAGOL setup$' ShadowByzantine/04_construction.per; then
            echo '1925-1949 already present'
            exit 0
          fi
          tail -n 1 ShadowByzantine/04_construction.per | grep -q '^)$'
          cat tools/forensics/r07_1925_1949_fragment.per >> ShadowByzantine/04_construction.per
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ShadowByzantine/04_construction.per')
          s=p.read_text(encoding='utf-8')
          s=s.replace('; Implemented authenticated slices: 1794-1805, 1815-1924', '; Implemented authenticated donor slices: 1794-1805, 1815-1949')
          p.write_text(s,encoding='utf-8')
          PY
          rm tools/forensics/r07_1925_1949_fragment.per
          rm .github/workflows/apply-r07-1925-1949.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ShadowByzantine/04_construction.per
          git add -u -- .github/workflows/apply-r07-1925-1949.yml tools/forensics/r07_1925_1949_fragment.per
          git commit -m 'construction: implement authenticated R07 1925-1949'
          git push origin HEAD:main
