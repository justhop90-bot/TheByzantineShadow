name: Reconstruct authenticated ShadowSource

on:
  push:
    paths:
      - 'tools/forensics/reconstruct_shadow_source.py'
      - '.github/workflows/reconstruct-shadow-source.yml'

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch authenticated donor blob
        env:
          EXPECTED_GIT_BLOB_SHA: 70a18a3b69e8ea46bd5132673fe9fcf8a36595ee
        run: |
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/justhop90-bot/TheByzantineShadow/git/blobs/${EXPECTED_GIT_BLOB_SHA}" \
            -o /tmp/blob.json
          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          expected='70a18a3b69e8ea46bd5132673fe9fcf8a36595ee'
          d=json.loads(pathlib.Path('/tmp/blob.json').read_text())
          assert d['sha'] == expected
          assert d['encoding'] == 'base64'
          raw=base64.b64decode(d['content'])
          actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert actual == expected, (actual, expected)
          pathlib.Path('/tmp/ShadowSource.per').write_bytes(raw)
          print('GIT_BLOB_SHA1=',actual)
          print('RAW_CONTENT_SHA1=',hashlib.sha1(raw).hexdigest())
          print('BYTE_LENGTH=',len(raw))
          PY
      - name: Reconstruct and verify
        run: |
          python3 tools/forensics/reconstruct_shadow_source.py /tmp/shadow-source-rule-index.json /tmp/ShadowSource.per
          python3 - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('/tmp/shadow-source-rule-index.json').read_text())
          print('DEFRULE_COUNT=', d['defrule_count'])
          print('GIT_BLOB_SHA1=', d['actual_git_blob_sha1'])
          print('RAW_CONTENT_SHA1=', d['raw_content_sha1'])
          print('BYTE_LENGTH=', d['byte_length'])
          print('LINE_COUNT=', d['line_count'])
          PY
      - name: Build targeted control graph
        run: |
          python3 - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('/tmp/shadow-source-rule-index.json').read_text())
          keys={'gl-build-progress','gl-current-build-item','gl-progression-pause','gl-strategy','SPLIT','set-escrow-percentage','up-modify-escrow','release-escrow','disable-self','up-jump-rule'}
          targeted=[r for r in d['rules'] if keys.intersection(r['keywords'])]
          pathlib.Path('/tmp/shadow-targeted-rules.json').write_text(json.dumps(targeted,indent=2))
          print('TARGETED_RULES=',len(targeted))
          for r in targeted:
              print(f"{r['ordinal']}:{r['source_line_start']}-{r['source_line_end']} jump={r['jump_targets_raw']} keys={','.join(r['keywords'])}")
          PY
      - name: Publish reconstruction artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-source-authenticated-reconstruction
          path: |
            /tmp/ShadowSource.per
            /tmp/shadow-source-rule-index.json
            /tmp/shadow-targeted-rules.json
